name: Verify research archive and demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.13.3'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.22.3'
      - name: Verify archive and isolated HTTP contract
        run: python scripts/verify.py
      - name: Install React reconstruction dependencies
        working-directory: demo
        run: npm ci
      - name: Verify design model contracts
        working-directory: demo
        run: npm test
      - name: Build React reconstruction
        working-directory: demo
        run: npm run build
